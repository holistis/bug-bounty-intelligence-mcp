# Publishes this package to npm, from CI and never from a laptop, and without a token.
#
# WHY NOT FROM A LAPTOP. This account's second factor is a security key, which the npm
# CLI cannot use, so a local publish ends up asking for a recovery code, and npm's own
# documentation says using one triggers a 72 hour hold during which nothing can be
# published. A repository guard also blocks `npm publish` on a developer machine for the
# same reason (see this repo's agent tooling for the exact message).
#
# WHY NO TOKEN. npm's trusted publishing exchanges this workflow's OIDC identity for a
# short-lived credential, so there is no long-lived secret to leak, rotate, or forget
# before it expires. The trust is pinned on npmjs.com to exactly this repository and this
# filename, so neither may be renamed without recreating that configuration there first.
# If the publish step below fails on authentication, that configuration is the thing to
# check (npmjs.com -> package settings -> Trusted Publisher -> GitHub Actions), not a
# token to add back.
#
# TWO THINGS THAT MAKE THIS FAIL SILENTLY, both guarded below. Trusted publishing needs
# npm 11.5.1 or newer, and an older npm does not warn, it simply publishes the old way or
# fails on authentication. And setup-node's `registry-url` writes an .npmrc with
# `_authToken=${NODE_AUTH_TOKEN}`; with no token set that leaves an empty credential that
# can produce an auth error instead of falling through to OIDC. So: no registry-url here.
#
# WHY MANUAL ONLY. Publishing is close to irreversible: npm restricts unpublishing after
# 72 hours and once anything depends on the package. A human decides when, and the
# version that goes out is whatever package.json says at that moment.
name: npm-publish

on:
  workflow_dispatch:
    inputs:
      bevestig:
        description: 'Type publish to confirm'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless the dispatch said publish
        run: |
          if [ "${{ inputs.bevestig }}" != "publish" ]; then
            echo "the confirmation box did not say publish, stopping before anything happens"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: npm must be new enough for trusted publishing, and say so out loud
        run: |
          echo "npm as shipped with this node: $(npm --version)"
          npm install -g npm@latest
          V=$(npm --version)
          echo "npm after upgrade: $V"
          node -e '
            const need = [11, 5, 1];
            const have = process.argv[1].split(".").map(Number);
            for (let i = 0; i < 3; i++) {
              if ((have[i] ?? 0) > need[i]) break;
              if ((have[i] ?? 0) < need[i]) {
                console.error("npm " + process.argv[1] + " cannot do trusted publishing, 11.5.1 is the floor");
                process.exit(1);
              }
            }
            console.log("npm " + process.argv[1] + " can exchange the OIDC identity");
          ' "$V"

      - name: The real smoke test must pass before anything is published
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Read the version, and refuse if it is already on the registry
        id: versie
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          echo "name=$N" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$N/$V")
          echo "registry answered $CODE for $N@$V"
          if [ "$CODE" = "200" ]; then
            echo "that version already exists, nothing to do"
            exit 1
          fi

      # No NODE_AUTH_TOKEN here on purpose. If this step fails on authentication, the
      # trusted publisher on npmjs.com is missing or points at a different repository or
      # filename, and that is the thing to fix. Putting a token back would hide it.
      - name: Publish with no token, using this workflow's own identity
        run: npm publish --provenance --access public

      - name: Check from outside what the registry now serves
        run: |
          # npm answers 0.0.0-stage for a few minutes after a publish ("your package is
          # being processed"), a staging placeholder, not a failure. Wait for the real
          # version instead of a flat sleep.
          N="${{ steps.versie.outputs.name }}"
          V="${{ steps.versie.outputs.version }}"
          for i in $(seq 1 30); do
            if npm view "$N@$V" version >/dev/null 2>&1; then
              echo "registry serves $N@$V after $((i * 10))s"
              break
            fi
            echo "not there yet after $((i * 10))s, npm says: $(npm view "$N" version 2>&1 | tail -1)"
            sleep 10
          done
          npm view "$N@$V" version dist.tarball

      - name: A real MCP client must be able to run the just-published package
        run: |
          cd "$(mktemp -d)"
          N="${{ steps.versie.outputs.name }}"
          V="${{ steps.versie.outputs.version }}"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@modelcontextprotocol/sdk@^1.32.2"
          cat > check.mjs <<'EOF'
          import { Client } from '@modelcontextprotocol/sdk/client/index.js'
          import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js'
          const [, , naam, versie] = process.argv
          const transport = new StdioClientTransport({ command: 'npx', args: ['-y', `${naam}@${versie}`] })
          const client = new Client({ name: 'publish-check', version: '0.0.1' }, { capabilities: {} })
          await client.connect(transport)
          const { tools } = await client.listTools()
          if (tools.length !== 3) { console.error('verwacht 3 tools, kreeg', tools.length); process.exit(1) }
          console.log(`npx resolved ${naam}@${versie} and it answers with ${tools.length} tools`)
          await client.close()
          process.exit(0)
          EOF
          opgelost=0
          for i in $(seq 1 18); do
            if node check.mjs "$N" "$V"; then opgelost=1; break; fi
            echo "npx cannot resolve $N@$V yet (attempt $i), waiting 10s"
            sleep 10
          done
          if [ "$opgelost" != 1 ]; then echo "npx never resolved $N@$V within three minutes"; exit 1; fi
