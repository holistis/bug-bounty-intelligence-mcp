name: Recount

# Runs every check.mjs under results/ on a GitHub runner, so the counts in our result folders are recounted by a machine that is not ours.
# It checks the counting and the hashes. It does not check whether the judges' verdicts are right.
# It also tests the checkers themselves: tools/checker-selftest.mjs plants ten kinds of fault (a made-up id, a flipped verdict, an emptied or cut list, a missing, extra or swapped entry, and more) in a copy of every folder, and this workflow fails if any checker accepts it.

on:
  push:
    paths:
      - 'results/**'
      - 'tools/**'
      - 'bench/**'
      - '.github/**'
      - '.gitattributes'
  pull_request:
    paths:
      - 'results/**'
      - 'tools/**'
      - 'bench/**'
      - '.github/**'
      - '.gitattributes'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recount every result folder
        run: |
          status=0
          for d in results/*/; do
            if [ -f "$d/check.mjs" ]; then
              echo "== $d"
              (cd "$d" && node check.mjs) || status=1
            fi
          done
          exit $status
      - name: Every folder with open-judge answers must print how many were voided
        run: |
          status=0
          for d in results/*/; do
            if [ -d "$d/hypothesis-verdicts" ]; then
              (cd "$d" && node check.mjs) | grep -Eq "open-judge answers? with an unknown id" || { echo "MISSING voided count: $d"; status=1; }
            fi
          done
          exit $status
      - name: Tests of the judges and of the judge selection (a judge may not invent or lose an id, two voided answers are not agreement)
        run: node --test bench/*.test.mjs
      - name: A published voided-answer count must have a range next to it, not just the count
        run: node tools/ranges-check.mjs && node --test tools/ranges-check.test.mjs
      - name: Every hash list must name every file in its folder (the gaps of old folders are listed by name in tools/manifest-policy.json)
        run: node tools/verify-manifests.mjs && node --test tools/verify-manifests.test.mjs tools/manifest-faults.test.mjs tools/checker-faults.test.mjs
      - name: Plant a fault in a copy of every folder, no checker may accept it
        run: node tools/checker-selftest.mjs
